# Cut a release by pushing a tag v<version> matching [workspace.package] version
# in Cargo.toml (docs/RELEASING.md). Tags containing "-test" (v0.0.0-test.1)
# build everything from the current crate version but only create a draft.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Official builds: the binary may replace itself with signed updates.
  SARD_RELEASE_BUILD: "1"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      draft: ${{ steps.v.outputs.draft }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          tag=$GITHUB_REF_NAME
          version=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
          draft=false prerelease=false
          case "$tag" in *-test*) draft=true ;; esac
          case "$version" in *-*) prerelease=true ;; esac
          if [ "$tag" != "v$version" ] && [ "$draft" != true ]; then
            echo "::error::tag $tag does not match the crate version $version: bump [workspace.package] version in Cargo.toml (and Cargo.lock) first, or tag v$version"
            exit 1
          fi
          echo "version=$version draft=$draft prerelease=$prerelease"
          { echo "version=$version"; echo "draft=$draft"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

  linux:
    needs: meta
    runs-on: ubuntu-latest
    # Build against Debian 12's glibc (2.36): the binary then needs glibc >= 2.34
    # (Ubuntu 22.04, Debian 12, RHEL 9) without loader warnings. On a newer build
    # host, std's weak references to newer glibc symbols (pidfd_spawnp, 2.39) make
    # older loaders print "weak version not found" on every start.
    container: rust:1-bookworm
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo --version && ldd --version | sed -n 1p
      - run: scripts/package-linux.sh --out dist
      - name: Smoke test the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/x" "$RUNNER_TEMP/home"
          tar -xzf "dist/sard-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/x"
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/x/sard-$VERSION-linux-x86_64/install.sh"
          test "$("$RUNNER_TEMP/home/.local/bin/sard" version)" = "sard $VERSION"
          ldd "$RUNNER_TEMP/home/.local/bin/sard"
          # Oldest glibc that can load it: the highest non-weak GLIBC_ version it needs.
          floor=$(readelf -V -W "$RUNNER_TEMP/home/.local/bin/sard" \
            | awk '/Version needs/ {n=1} n && /Name: GLIBC_/ && /Flags: none/ {sub(/.*Name: GLIBC_/, ""); sub(/ .*/, ""); print}' \
            | sort -V | tail -n1)
          echo "needs glibc >= $floor"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/sard-*-linux-x86_64.tar.gz
          if-no-files-found: error

  linux-compat:
    # The tarball must run (and install) on the oldest supported distro.
    needs: [meta, linux]
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - run: |
          ldd --version | sed -n 1p
          tar -xzf "dist/sard-$VERSION-linux-x86_64.tar.gz" -C /tmp
          HOME=/tmp/home "/tmp/sard-$VERSION-linux-x86_64/install.sh"
          out=$(/tmp/home/.local/bin/sard version 2>&1)
          echo "$out"
          test "$out" = "sard $VERSION"

  macos:
    needs: meta
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    outputs:
      signing: ${{ steps.result.outputs.signing }}
      notarized: ${{ steps.result.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked -p sard

      - name: Import the signing certificate into a temporary keychain
        id: cert
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SELFSIGN_P12: ${{ secrets.MACOS_SELFSIGN_P12 }}
          MACOS_SELFSIGN_P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD }}
        run: |
          kind=developer-id
          if [ -z "$MACOS_CERTIFICATE_P12" ] && [ -n "$MACOS_SELFSIGN_P12" ]; then
            # Sard's own certificate (packaging/macos/sard-codesign.pem): not
            # notarizable, but a stable identity, so macOS keeps Screen Recording /
            # Accessibility grants across updates (ad-hoc signatures lose them).
            kind=selfsigned
            MACOS_CERTIFICATE_P12=$MACOS_SELFSIGN_P12
            MACOS_CERTIFICATE_PASSWORD=$MACOS_SELFSIGN_P12_PASSWORD
          fi
          [ -n "$MACOS_CERTIFICATE_P12" ] || kind=adhoc
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = adhoc ]; then
            echo "::warning::no signing certificate secret is set: the macOS build is ad-hoc signed and not notarized"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/sard-signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Search the temporary keychain first (and keep the existing ones).
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          if [ "$kind" = selfsigned ]; then
            # codesign only uses trusted identities: trust this one certificate
            # for code signing on the (throwaway) runner.
            sudo security add-trusted-cert -d -r trustRoot -p codeSign \
              -k /Library/Keychains/System.keychain packaging/macos/sard-codesign.pem
            identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Sard Code Signing/ {print $2; exit}')
          else
            identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          fi
          if [ -z "$identity" ]; then
            echo "::error::the certificate secret contains no valid signing identity ($kind)"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build and sign Sard.app
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          KIND: ${{ steps.cert.outputs.kind }}
        run: |
          extra=()
          [ "$KIND" = selfsigned ] && extra+=(--no-timestamp)
          scripts/macos-app.sh --no-build --release --zip --identity "$IDENTITY" "${extra[@]}" --out dist
          codesign --verify --strict --verbose=2 dist/Sard.app
          codesign -dv dist/Sard.app
          test "$(dist/Sard.app/Contents/MacOS/sard version)" = "sard $VERSION"

      - name: Notarize and staple
        id: notarize
        if: steps.cert.outputs.kind == 'developer-id'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::APPLE_API_KEY_ID / APPLE_API_ISSUER_ID / APPLE_API_KEY_P8 not set: Developer ID signed but NOT notarized"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          zip="dist/sard-$VERSION-macos-arm64.zip"
          xcrun notarytool submit "$zip" "${auth[@]}" --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          id=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")
          status=$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            [ -z "$id" ] || xcrun notarytool log "$id" "${auth[@]}" || true
            echo "::error::notarization failed (status: ${status:-none})"
            exit 1
          fi
          xcrun stapler staple dist/Sard.app
          xcrun stapler validate dist/Sard.app
          spctl --assess --type execute --verbose=2 dist/Sard.app
          # The ticket is stapled into the bundle: zip it again.
          rm -f "$zip"
          ditto -c -k --keepParent dist/Sard.app "$zip"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Result
        id: result
        env:
          KIND: ${{ steps.cert.outputs.kind }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          echo "signing=$KIND" >> "$GITHUB_OUTPUT"
          echo "notarized=${NOTARIZED:-false}" >> "$GITHUB_OUTPUT"

      - name: Remove temporary keychain and API key
        if: always()
        env:
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: |
          [ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/cert.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/sard-*-macos-arm64.zip
          if-no-files-found: error

  release:
    needs: [meta, linux, linux-compat, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write and sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY is not set; without a signed latest.txt existing installs cannot update (docs/RELEASING.md)"
            exit 1
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          scripts/release-manifest.sh dist "$VERSION" "$base" "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          tar -xzf "dist/sard-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          sard="$RUNNER_TEMP/sard-$VERSION-linux-x86_64/sard"
          # release-sign refuses unless the signature verifies with the keys built into sard.
          printf '%s\n' "$UPDATE_SIGNING_KEY" | "$sard" release-sign - dist/latest.txt
          # Same path as an installed client: fetch over HTTP, verify, parse.
          (cd dist && python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
          sleep 1
          SARD_UPDATE_URL=http://127.0.0.1:8765 "$sard" update --check | tee "$RUNNER_TEMP/check.txt"
          grep -q "is up to date (latest release: $VERSION)" "$RUNNER_TEMP/check.txt"
          (cd dist && sha256sum sard-* latest.txt latest.txt.sig > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Release notes
        env:
          SIGNING: ${{ needs.macos.outputs.signing }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          {
            if [ "$SIGNING" = adhoc ]; then
              echo "> [!WARNING]"
              echo "> The macOS build of this release is **ad-hoc signed and not notarized** (no Developer ID certificate was configured)."
              echo "> Gatekeeper blocks it on first launch: Control-click Sard.app → Open, or run \`xattr -dr com.apple.quarantine Sard.app\`."
              echo "> macOS also forgets the Screen Recording / Accessibility grants on every update of an ad-hoc signed app."
              echo
            elif [ "$SIGNING" = selfsigned ]; then
              echo "> [!NOTE]"
              echo "> The macOS build is signed with Sard's own certificate, not an Apple Developer ID, so it is not notarized."
              echo "> The one-line installer (README) installs it directly. A zip downloaded with a browser needs Control-click → Open the first time."
              echo "> Screen Recording / Accessibility grants are kept across updates."
              echo
            elif [ "$NOTARIZED" != true ]; then
              echo "> [!WARNING]"
              echo "> The macOS build of this release is signed with Developer ID but **not notarized**; Gatekeeper asks for confirmation on first launch (Control-click → Open)."
              echo
            fi
            echo "## Install"
            echo
            echo "- **Linux x86_64**: \`tar -xzf sard-$VERSION-linux-x86_64.tar.gz && sard-$VERSION-linux-x86_64/install.sh\` (installs into \`~/.local\`, no root)"
            echo "- **macOS 13+ (Apple Silicon)**: unzip \`sard-$VERSION-macos-arm64.zip\` and move **Sard.app** to /Applications"
            echo "- Already installed: \`sard update\`"
            echo
            echo "Verify downloads with \`SHA256SUMS\`. \`latest.txt\` (+ \`.sig\`) is the signed manifest the built-in updater reads."
            echo
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          DRAFT: ${{ needs.meta.outputs.draft }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=()
          title="sard $VERSION"
          if [ "$DRAFT" = true ]; then flags+=(--draft --latest=false); title="$title (test $GITHUB_REF_NAME)"; fi
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          # gh uploads every asset to a draft first and publishes at the end, so
          # latest.txt never goes live before the packages it points to.
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${flags[@]}" \
            dist/sard-"$VERSION"-linux-x86_64.tar.gz dist/sard-"$VERSION"-macos-arm64.zip \
            dist/latest.txt dist/latest.txt.sig dist/SHA256SUMS
