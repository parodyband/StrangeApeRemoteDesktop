[package]
name = "sard-core"
description = "Platform-independent protocol, crypto, FEC and transport for StrangeApeRemoteDesktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11", default-features = false }
libc.workspace = true
sha2 = { version = "0.11", default-features = false }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
