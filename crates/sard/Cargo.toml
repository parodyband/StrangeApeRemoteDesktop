[package]
name = "sard"
description = "StrangeApeRemoteDesktop: low-latency GPU remote desktop for Linux and macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sard-core.workspace = true
libc.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
ed25519-dalek = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
sard-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sard-macos.workspace = true
